# Fabrique automatiquement l'APK à chaque modification du code,
# puis le publie dans l'onglet « Releases » du dépôt GitHub.
name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà installé sur les serveurs de GitHub (ANDROID_HOME)
      - name: Vérifier le SDK Android
        run: |
          echo "SDK Android = $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Tester le moteur de guidage
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Compiler l'APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "EBikeNavigatorPro-v2.0.${{ github.run_number }}.apk"

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: EBikeNavigatorPro-apk
          path: EBikeNavigatorPro-*.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: E-Bike Navigator Pro 2.0.${{ github.run_number }}
          body: APK à installer sur Android (Samsung S10+). Télécharger le fichier .apk ci-dessous.
          files: EBikeNavigatorPro-*.apk
